{% extends 'base.html' %}
{% block title %}Tool | {{ slug }}{% endblock %}
{% block content %}
<section class="grid lg:grid-cols-4 gap-6">
  <article class="lg:col-span-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 space-y-4">
    <h1 class="text-2xl font-bold" id="toolTitle">{{ slug.replace('-', ' ').title() }}</h1>
    <p class="text-slate-600 dark:text-slate-300">Tool workspace boilerplate. Insert specific controls and result blocks here.</p>
    <div id="toolApp" class="rounded-xl bg-slate-100 dark:bg-slate-800 p-4 min-h-[240px]"></div>
  </article>

  <aside class="space-y-4">
    <div id="ad-sidebar-1" class="rounded-xl border border-dashed border-slate-400 dark:border-slate-700 p-4 text-xs text-center">Ad Placeholder: Sidebar 300x250</div>
    <div id="ad-sidebar-2" class="rounded-xl border border-dashed border-slate-400 dark:border-slate-700 p-4 text-xs text-center">Ad Placeholder: Direct Link CTA</div>
  </aside>
</section>
{% endblock %}
