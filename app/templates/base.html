<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}All-in-One Utility Tools{% endblock %}</title>
  <script>
    if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
  <header class="sticky top-0 z-50 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <a href="/" class="font-bold text-xl">UtilityHub 55+</a>
      <button id="themeToggle" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700">Toggle Theme</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">{% block content %}{% endblock %}</main>

  <aside class="max-w-7xl mx-auto px-4 pb-10">
    <section id="ad-banner-top" class="rounded-xl border border-dashed border-slate-400 dark:border-slate-700 p-6 text-center text-sm text-slate-500">
      Ad Placeholder: Top Banner (safe zone for Monetag / display scripts)
    </section>
  </aside>

  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
