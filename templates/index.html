<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConvertOmni</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#070B13] via-[#0c1220] to-[#121926] text-slate-100">
<main class="max-w-7xl mx-auto p-4 md:p-8">
  <section class="backdrop-blur-2xl bg-slate-900/40 border border-slate-700/50 shadow-2xl rounded-2xl p-6 md:p-8">
    <div class="flex flex-col lg:flex-row justify-between gap-4 mb-6">
      <div>
        <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">ConvertOmni</h1>
        <p id="cap" class="text-sm text-slate-400 mt-1">Loading capabilities...</p>
      </div>
      <div class="flex gap-3 flex-wrap items-end">
        <div>
          <label class="text-sm text-slate-300 block mb-1">Convert All to</label>
          <select id="globalTarget" class="w-52 bg-slate-900 border border-slate-700 rounded-xl p-3"><option value="">Auto</option></select>
        </div>
        <div>
          <label class="text-sm text-slate-300 block mb-1">Filter</label>
          <select id="statusFilter" class="w-40 bg-slate-900 border border-slate-700 rounded-xl p-3"><option value="all">All</option><option value="queued">Queued</option><option value="uploading">Uploading</option><option value="ready">Ready</option><option value="failed">Failed</option></select>
        </div>
      </div>
    </div>

    <div id="dropzone" class="rounded-2xl p-10 text-center border-2 border-dashed border-cyan-500/40 bg-slate-900/20 hover:bg-slate-800/30 transition cursor-pointer">
      <input id="pick" type="file" multiple class="hidden" />
      <p class="text-cyan-300 font-semibold">Drop files or click to upload</p>
    </div>

    <div class="mt-4 flex gap-3 text-sm text-slate-300" id="stats"></div>
    <div class="mt-4 space-y-3" id="queue"></div>

    <div class="flex justify-end mt-6 gap-3 flex-wrap">
      <button id="retryFailed" class="px-4 py-3 rounded-xl bg-rose-600/70">Retry Failed</button>
      <button id="clearDone" class="px-4 py-3 rounded-xl bg-slate-700">Clear Completed</button>
      <button id="run" class="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-900 font-bold">Convert Batch</button>
    </div>
  </section>
</main>

<div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl p-5">
    <div class="flex justify-between items-center mb-3"><h3 class="font-bold">Advanced Settings</h3><button id="mclose">✕</button></div>
    <div id="mcontent"></div>
    <button id="msave" class="mt-4 px-4 py-2 bg-cyan-500 text-slate-900 rounded-lg font-semibold">Save</button>
  </div>
</div>

<script>
const FORMAT_MATRIX = {images:{extensions:["png","jpg","jpeg","webp","svg","gif","bmp","tiff","tif","ico","psd","eps","heic","heif","ai","dds","tga","raw","cr2","nef","orf","sr2","inf","pbm","pgm","ppm","pnm","pcx","wbmp"],targets:["png","jpg","jpeg","webp","pdf","gif","bmp","tiff","ico","tga"]},documents:{extensions:["pdf","docx","doc","txt","rtf","odt","html","htm","xps","epub","pages","md","tex","pdfx","wpd","wps","abw","lwp","rst","sdw"],targets:["pdf","docx","txt","html","epub","rtf"]},audio:{extensions:["mp3","wav","m4a","flac","aac","ogg","wma","amr","aiff","aif","opus","pcm","alac","m4b","m4p","mp2","mp1","ac3","dts","ra","rm","voc","iff","mka","wv","ape","shn","cdr","oga","mid","midi"],targets:["mp3","wav","m4a","flac","aac","ogg","wma","opus"]},video:{extensions:["mp4","mkv","avi","mov","wmv","flv","webm","3gp","mpeg","mpg","m4v","vob","ogv","ts","mts","m2ts","divx","xvid","rmvb","asf","amv","qt","f4v","f4p","f4a","f4b","m2v","m1v","svi","3g2"],targets:["mp4","mkv","avi","mov","webm","mp3","wav","gif"]},spreadsheets:{extensions:["xls","xlsx","csv","ods","tsv","xlsm","xltx","xltm","xlsb","xml","numbers","dif","dbf","slk","sxc","fods","qpw","wb1","wb3"],targets:["xlsx","csv","pdf","ods","html"]},presentations:{extensions:["ppt","pptx","odp","pps","ppsx","pot","potx","key","keynote","dps","sda","sxd","sti","otp","fodp","uop","pptm","potm","ppsm"],targets:["pptx","pdf","odp","html"]},ebooks:{extensions:["epub","mobi","azw3","fb2","lit","lrf","prc","pdb","pml","rb","snb","tcr","cbz","cbr","cbc","chm","djvu","htmlz","txtz"],targets:["epub","mobi","pdf","txt","azw3"]},archives:{extensions:["zip","rar","7z","tar","gz","bz2","xz","iso","tgz","tbz2","tlz","txz","z","lz","lzma","lzh","arj","cab","dmg","wim","xar","zipx","ace","apk","jar","war","ear","cpio","rpm","deb"],targets:["zip","tar","gz","7z"]},fonts:{extensions:["ttf","otf","woff","woff2","eot","sfnt","pfa","pfb","afm","bin","bdf","pcf","pmf","ttf.vfont","otc","suit","ttc","dfont","snf","gxf"],targets:["ttf","otf","woff","woff2"]},vectors:{extensions:["svg","ai","eps","cdr","wmf","emf","dxf","dwg","plt","cgm","svgz","fxg","pdfa","fig","sk","sk1","skencil","vml","xarv","hpgl"],targets:["svg","png","pdf","eps"]},cad_3d:{extensions:["stl","obj","fbx","3ds","dae","ply","iges","step","stp","blend","c4d","ma","mb","max","lwo","lws","lxo","skp","wrz","wrl","x3d"],targets:["stl","obj","fbx","dxf"]}};
const queue=[]; let rid=0; let active=null;
const all=[...new Set(Object.values(FORMAT_MATRIX).flatMap(v=>v.targets))].sort();
const qel=queueEl=document.getElementById('queue');
all.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t.toUpperCase();globalTarget.appendChild(o);});
function ext(n){const p=n.toLowerCase().split('.');return p.length>1?p.pop():''}
function cat(e){for(const [k,v] of Object.entries(FORMAT_MATRIX)) if(v.extensions.includes(e)) return k;return null}
function size(b){const u=['B','KB','MB','GB'];const i=Math.floor(Math.log(b||1)/Math.log(1024));return `${(b/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`}
function syncStats(){const c={queued:0,uploading:0,ready:0,failed:0}; queue.forEach(x=>c[x.status]=(c[x.status]||0)+1); stats.innerHTML=`<span>Queued: ${c.queued}</span><span>Processing: ${c.uploading}</span><span>Ready: ${c.ready}</span><span>Failed: ${c.failed}</span><span>Total: ${queue.length}</span>`;}
function draw(){qel.innerHTML='';queue.filter(f=>statusFilter.value==='all'||f.status===statusFilter.value).forEach(f=>{const d=document.createElement('div');d.className='grid md:grid-cols-7 gap-3 bg-slate-900/50 border border-slate-700 rounded-xl p-3 items-center';d.innerHTML=`<div>${f.category||'unknown'}</div><div class='md:col-span-2'><div>${f.file.name.slice(0,25)}</div><div class='text-xs text-slate-400'>${size(f.file.size)}</div></div><select data-t='${f.id}' class='bg-slate-950 border border-slate-700 rounded p-2'>${f.targets.map(t=>`<option ${f.target===t?'selected':''} value='${t}'>${t.toUpperCase()}</option>`).join('')}</select><div><div class='text-xs'>${f.status}</div><div class='h-2 bg-slate-800 rounded'><div class='h-2 ${f.status==='failed'?'bg-rose-400':'bg-cyan-400'} rounded' style='width:${f.progress}%'></div></div></div><button data-s='${f.id}'>⚙️</button><button data-r='${f.id}'>✕</button><button data-retry='${f.id}' class='text-xs px-2 py-1 rounded bg-amber-600/70'>Retry</button>`;qel.appendChild(d);}); syncStats();}
function add(files){[...files].forEach(file=>{const e=ext(file.name),c=cat(e),t=c?FORMAT_MATRIX[c].targets:[];queue.push({id:++rid,file,category:c,targets:t,target:t[0]||'',status:'queued',progress:0,options:{quality:80,bitrate:'192k',frame_rate:30}})});draw()}
async function runOne(item){if(!item.target)return;item.status='uploading';item.progress=10;draw();const fd=new FormData();fd.append('file',item.file);fd.append('target',item.target);fd.append('options',JSON.stringify(item.options));const tick=setInterval(()=>{if(item.progress<90){item.progress+=5;draw();}},220);try{const r=await fetch('/api/convert',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${item.file.name.split('.').slice(0,-1).join('.')}.${item.target}`;a.click();URL.revokeObjectURL(a.href);item.progress=100;item.status='ready';}catch(e){item.status='failed';item.progress=100}clearInterval(tick);draw();}
async function runBatch(){await Promise.all(queue.filter(q=>q.status==='queued'||q.status==='failed').map(runOne));}
async function loadCapabilities(){try{const r=await fetch('/api/capabilities');const j=await r.json();cap.textContent=`${j.total_extensions}+ extensions • max upload ${j.max_upload_mb}MB • retention ${j.retention_ttl_seconds}s`; }catch{cap.textContent='Capabilities unavailable';}}

dropzone.onclick=()=>pick.click();pick.onchange=e=>add(e.target.files);['dragenter','dragover'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('ring-4','ring-emerald-500/40')}));['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('ring-4','ring-emerald-500/40')}));dropzone.addEventListener('drop',e=>add(e.dataTransfer.files));
run.onclick=runBatch; clearDone.onclick=()=>{for(let i=queue.length-1;i>=0;i--){if(queue[i].status==='ready')queue.splice(i,1)} draw();}; retryFailed.onclick=()=>{queue.forEach(q=>{if(q.status==='failed'){q.status='queued';q.progress=0}}); draw(); runBatch();};
globalTarget.onchange=e=>{queue.forEach(i=>{if(i.targets.includes(e.target.value))i.target=e.target.value});draw();}; statusFilter.onchange=draw;
qel.addEventListener('change',e=>{const id=+e.target.dataset.t;if(id){const it=queue.find(x=>x.id===id);if(it)it.target=e.target.value;}});
qel.addEventListener('click',e=>{const r=+e.target.dataset.r,s=+e.target.dataset.s,rt=+e.target.dataset.retry;if(r){const i=queue.findIndex(x=>x.id===r);if(i>=0)queue.splice(i,1);draw();}if(rt){const it=queue.find(x=>x.id===rt);if(it){it.status='queued';it.progress=0;runOne(it);} }if(s){active=queue.find(x=>x.id===s);if(!active)return;let h='';if(['images','vectors'].includes(active.category))h+=`<label>Quality <input id='q' type='range' min='1' max='100' value='${active.options.quality}' class='w-full'></label>`;if(active.category==='audio')h+=`<label>Bitrate <select id='b' class='w-full bg-slate-950 border border-slate-700 rounded p-2'><option>128k</option><option ${active.options.bitrate==='192k'?'selected':''}>192k</option><option ${active.options.bitrate==='320k'?'selected':''}>320k</option></select></label>`;if(active.category==='video')h+=`<label>FPS <select id='f' class='w-full bg-slate-950 border border-slate-700 rounded p-2'><option ${active.options.frame_rate===24?'selected':''}>24</option><option ${active.options.frame_rate===30?'selected':''}>30</option><option ${active.options.frame_rate===60?'selected':''}>60</option></select></label>`;mcontent.innerHTML=h||'<p>No advanced settings.</p>';modal.classList.remove('hidden');modal.classList.add('flex');}});
mclose.onclick=()=>{modal.classList.add('hidden');modal.classList.remove('flex')};
msave.onclick=()=>{if(!active)return;const q=document.getElementById('q'),b=document.getElementById('b'),f=document.getElementById('f');if(q)active.options.quality=+q.value;if(b)active.options.bitrate=b.value;if(f)active.options.frame_rate=+f.value;mclose.onclick();};
loadCapabilities(); draw();
</script>
</body>
</html>
